name: Build and Distribute Admin and Client APKs

on:
  push:
    branches:
      - main

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Create google-services.json from GitHub Secrets
      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      # Build Admin APK (Signed automatically with debug keystore)
      - name: Build Admin APK
        run: |
          flutter build apk --flavor admin -t lib/main_admin.dart --release

      # Build Client APK (Signed automatically with debug keystore)
      - name: Build Client APK
        run: |
          flutter build apk --flavor client -t lib/main_client.dart --release

      # Distribute Admin APK to Firebase App Distribution
      - name: Distribute Admin APK
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ADMIN_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: admin-testers
          file: build/app/outputs/flutter-apk/app-admin-release.apk

      # Distribute Client APK to Firebase App Distribution
      - name: Distribute Client APK
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_CLIENT_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: client-testers
          file: build/app/outputs/flutter-apk/app-client-release.apk