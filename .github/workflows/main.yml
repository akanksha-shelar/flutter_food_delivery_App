name: Flutter CI/CD Pipeline

# Trigger workflow on push or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Distribute APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java environment
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 4: Install Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # Step 5: Analyze code (ignoring non-fatal warnings)
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Step 6: Build Android APK
      - name: Build Android APK
        run: flutter build apk --release

      # Step 7: Upload the built APK as a downloadable artifact on GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Step 8: Upload APK to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: emertozd/Firebase-Distribution-Github-Action@v6
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk